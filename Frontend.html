<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Women's Safety</title>
	<link rel="stylesheet" href="css/style.css">
</head>

<body>
	<header>
		<h1>Women's Safety</h1>

		<nav>
			<a class="login-link" href="#login">Login / Signup</a>

			<div class="menu">
				<button class="menu-button" type="button" aria-label="Open menu" aria-expanded="false">&#8942;</button>
				<div class="menu-links">
					<a href="#home">Home</a>
					<a href="#profile">Profile</a>
					<button type="button">Logout</button>
				</div>
			</div>
		</nav>
	</header>
	<main class="view-container">
		<section id="home-page" class="view-panel active">
			<div class="home-content">
				<div class="contact-button-wrap">
					<button class="contact-button" type="button" aria-label="View trusted contact">Contact</button>
					<div class="trusted-contact" hidden>
						<span>Trusted Contact</span>
					</div>
				</div>
			</div>
		</section>

		<section id="safety-page" class="view-panel">
			<div class="sos-area">
				<p>Press the button below when you need emergency help.</p>
				<button class="sos-button" type="button" aria-label="SOS Alert">SOS Alert</button>
			</div>
		</section>

		<section id="alarm-page" class="view-panel">
			<div class="placeholder-panel">
				<h2>Alarm</h2>
			</div>
		</section>

		<section id="profile-page" class="view-panel">
			<div class="placeholder-panel">
				<h2>Profile</h2>
			</div>
		</section>
	</main>

	<nav class="bottom-nav" aria-label="Bottom navigation">
		<a href="#home-page" class="nav-link active">Home</a>
		<a href="#safety-page" class="nav-link">Safety</a>
		<a href="#alarm-page" class="nav-link">Alarm</a>
		<a href="#profile-page" class="nav-link">Profile</a>
	</nav>

	<script>
		const menuButton = document.querySelector('.menu-button');
		const menuLinks = document.querySelector('.menu-links');
		const navLinks = document.querySelectorAll('.nav-link');
		const panels = document.querySelectorAll('.view-panel');
		const contactButton = document.querySelector('.contact-button');
		const trustedContact = document.querySelector('.trusted-contact');

		menuButton.addEventListener('click', function () {
			const menuIsOpen = menuLinks.classList.toggle('show');
			menuButton.setAttribute('aria-expanded', menuIsOpen);
		});

		contactButton.addEventListener('click', function () {
			const isVisible = trustedContact.hidden;
			trustedContact.hidden = !isVisible;
		});

		navLinks.forEach(function (link) {
			link.addEventListener('click', function (event) {
				event.preventDefault();
				const targetId = this.getAttribute('href');
				panels.forEach(function (panel) {
					panel.classList.toggle('active', '#' + panel.id === targetId);
				});
				navLinks.forEach(function (navLink) {
					navLink.classList.toggle('active', navLink === link);
				});
				window.location.hash = targetId;
			});
		});
	</script>
</body>
</html>
